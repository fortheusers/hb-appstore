credits.license = Licenciado sob GPLv3. Este app é gratuito e de código aberto porque os usuários (como você!) merecem.
credits.cta = Vamos apoiar o homebrew e o direito de controlar quais softwares executamos em nossos próprios dispositivos!

credits.repo = Desenvolvimento e manutenção do repositório
credits.repo.desc = Estas são as principais pessoas responsáveis pela manutenção e desenvolvimento ativo do Homebrew App Store. Se houver um problema, são elas que você pode contatar!
credits.library = Desenvolvimento e suporte de bibliotecas
credits.library.desc = Sem as contribuições para bibliotecas e projetos de código aberto dessas pessoas, muitas funcionalidades deste programa não seriam possíveis.
credits.music = Música e som
credits.music.desc = Nas versões de Wii U e Switch, essas pessoas forneceram a música chiptune que toca em segundo plano. Elas tornam o app mais vivo e são geralmente incríveis!
credits.design = Desenvolvimento e design da interface
credits.design.desc = De uma forma ou de outra, todos nesta categoria forneceram informações sobre a funcionalidade principal, melhorias de qualidade de vida ou design da interface do usuário.
credits.toolchain = Toolchain e ambiente
credits.toolchain.desc = As organizações e pessoas nesta categoria tornam o homebrew possível em geral, criando e mantendo um ambiente coeso para a comunidade.
credits.extra = Agradecimentos especiais da comunidade homebrew
credits.extra.desc = Pessoas incríveis da comunidade cujo trabalho, palavras ou ações inspiraram de alguma forma este programa a existir dessa maneira.

